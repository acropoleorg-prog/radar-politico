<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Político · Acrópole</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #ffffff;
  --surface: #f4f4f4;
  --border:  #d8d8d8;
  --text:    #111111;
  --text-2:  #555555;
  --text-3:  #999999;
  --black:   #000000;
  --green:   #166534;
  --red:     #991b1b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.login-box {
  border: 1px solid var(--border);
  padding: 48px 40px;
  width: 360px;
}
.login-box .eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; letter-spacing: .18em;
  color: var(--text-3); text-transform: uppercase;
  margin-bottom: 12px;
}
.login-box h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 28px; }
.login-box input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; outline: none; margin-bottom: 12px;
}
.login-box input:focus { border-color: var(--black); }
.btn-primary {
  width: 100%; padding: 10px;
  background: var(--black); border: 1px solid var(--black);
  color: #fff; font-family: 'Inter', sans-serif;
  font-size: 13px; font-weight: 500;
  cursor: pointer; transition: opacity .15s;
}
.btn-primary:hover { opacity: .85; }
.login-error { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

/* ── LAYOUT ── */
#app { display: none; }

.topbar {
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 52px;
  display: flex; align-items: center; gap: 24px;
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
}
.brand { display: flex; align-items: baseline; gap: 8px; flex-shrink: 0; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
.brand-sub {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--text-3);
  text-transform: uppercase; letter-spacing: .1em;
}

.stats-strip { display: flex; gap: 20px; margin-left: auto; }
.stat { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3); }
.stat b { color: var(--text); font-weight: 500; }

.topbar-actions { display: flex; gap: 6px; }
.btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 6px 14px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text-2);
  cursor: pointer; transition: all .12s;
  text-transform: uppercase; letter-spacing: .06em; white-space: nowrap;
}
.btn:hover { border-color: var(--black); color: var(--black); }
.btn.filled { background: var(--black); color: #fff; border-color: var(--black); }
.btn.filled:hover { opacity: .85; }
.btn:disabled { opacity: .35; cursor: not-allowed; }

/* ── FILTERBAR ── */
.filterbar {
  padding: 10px 28px;
  display: flex; gap: 6px; align-items: center;
  border-bottom: 1px solid var(--border);
  background: var(--surface); flex-wrap: wrap;
}
.filter-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--text-3);
  text-transform: uppercase; letter-spacing: .12em; margin-right: 2px;
}
.ftag {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 4px 12px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text-3);
  cursor: pointer; transition: all .12s;
  text-transform: uppercase; letter-spacing: .05em;
}
.ftag:hover { border-color: var(--text-2); color: var(--text); }
.ftag.on { border-color: var(--black); background: var(--black); color: #fff; }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 6px; flex-shrink: 0; }
.search-input {
  margin-left: auto;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; padding: 4px 12px; outline: none; width: 200px;
}
.search-input:focus { border-color: var(--black); }
.search-input::placeholder { color: var(--text-3); }

/* ── MAIN ── */
.main { padding: 24px 28px 80px; }
.section-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-3); text-transform: uppercase; letter-spacing: .15em;
  margin-bottom: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 1px; background: var(--border); border: 1px solid var(--border);
}

/* ── CARD ── */
.card {
  background: var(--bg); padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  animation: fadeIn .2s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.card-header {
  display: flex; align-items: center;
  justify-content: space-between; gap: 8px;
}
.card-source {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--text-3);
  text-transform: uppercase; letter-spacing: .1em;
}
.card-badges { display: flex; gap: 6px; align-items: center; }
.badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  padding: 2px 7px; border: 1px solid var(--border);
  text-transform: uppercase; letter-spacing: .05em; color: var(--text-3);
}
.badge-approved { color: var(--green); border-color: currentColor; }
.badge-rejected { color: var(--red);   border-color: currentColor; }

.card-thumb {
  width: 100%; aspect-ratio: 16/9; object-fit: cover;
  border: 1px solid var(--border); display: block;
}
.card-title { font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; }
.card-summary { font-size: 13px; line-height: 1.6; color: var(--text-2); }
.card-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-3); }

/* ── POST PREVIEW ── */
.post-preview { border: 1px solid var(--border); background: var(--surface); }
.post-label {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-3); text-transform: uppercase; letter-spacing: .08em;
  padding: 7px 14px; border-bottom: 1px solid var(--border);
}
.post-content {
  font-size: 13px; line-height: 1.65; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
  padding: 14px; min-height: 60px; max-height: 220px; overflow-y: auto; outline: none;
}
.post-content:focus { background: var(--bg); }
.post-note {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-3); padding: 8px 14px;
  border-top: 1px solid var(--border);
}

/* ── CARD ACTIONS ── */
.card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.act {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  padding: 5px 12px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text-2);
  cursor: pointer; transition: all .12s;
  letter-spacing: .05em; text-transform: uppercase;
  text-decoration: none; display: inline-block;
}
.act:hover { border-color: var(--black); color: var(--black); }
.act-approve { border-color: var(--green); color: var(--green); }
.act-approve:hover { background: var(--green); color: #fff; }
.act-reject  { border-color: var(--red); color: var(--red); }
.act-reject:hover  { background: var(--red); color: #fff; }
.act-done { border-color: var(--green); color: var(--green); }
.act:disabled { opacity: .35; cursor: not-allowed; }

/* ── X VÍDEOS ── */
.xvideos-section { margin-top: 48px; }
.xvideos-add {
  display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
}
.xvideos-add input {
  flex: 1; min-width: 200px;
  padding: 8px 12px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text);
  font-family: 'IBM Plex Mono', monospace; font-size: 12px; outline: none;
}
.xvideos-add input:focus { border-color: var(--black); }
.xvideos-add input::placeholder { color: var(--text-3); }
.xvideo-list { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border); }
.xvideo-card {
  background: var(--bg); padding: 16px 20px;
  display: flex; align-items: center; gap: 16px;
}
.xvideo-info { flex: 1; min-width: 0; }
.xvideo-url {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  color: var(--text); word-break: break-all;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.xvideo-note { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.xvideo-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-3); margin-top: 2px; }
.xvideo-actions { display: flex; gap: 6px; flex-shrink: 0; }

/* ── EMPTY / LOADER ── */
.empty {
  grid-column: 1/-1; padding: 60px 24px;
  text-align: center; color: var(--text-3);
  font-size: 13px; background: var(--bg);
}
.xvideo-empty { padding: 32px; text-align: center; color: var(--text-3); font-size: 13px; background: var(--bg); }
.loader-bar {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: var(--black); display: none; z-index: 999;
  animation: loadbar 1s ease infinite;
}
.loader-bar.on { display: block; }
@keyframes loadbar {
  0%   { left: 0; right: 100%; }
  50%  { left: 0; right: 0; }
  100% { left: 100%; right: 0; }
}

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--black); color: #fff;
  padding: 10px 18px;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  opacity: 0; transform: translateY(8px);
  transition: all .2s; pointer-events: none; z-index: 200; max-width: 300px;
}
#toast.show { opacity: 1; transform: translateY(0); }

@media(max-width: 640px) {
  .topbar { padding: 0 16px; flex-wrap: wrap; height: auto; padding: 10px 16px; }
  .stats-strip { display: none; }
  .main { padding: 16px 12px 60px; }
  .grid { grid-template-columns: 1fr; }
  .filterbar { padding: 10px 12px; }
  .search-input { width: 100%; margin-left: 0; margin-top: 6px; }
  .xvideos-add input { min-width: 100%; }
}
</style>
</head>
<body>

<div class="loader-bar" id="loaderBar"></div>
<div id="toast"></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="eyebrow">Acrópole · Monitor</div>
    <h2>Radar Político</h2>
    <input type="password" id="passInput" placeholder="senha de acesso" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginErr">Senha incorreta.</div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="topbar">
    <div class="brand">
      <span class="brand-name">Radar Político</span>
      <span class="brand-sub">Acrópole</span>
    </div>
    <div class="stats-strip" id="statsStrip">
      <span class="stat"><b id="stTotal">—</b> total</span>
      <span class="stat"><b id="stPending">—</b> pendentes</span>
      <span class="stat"><b id="stApproved">—</b> aprovados</span>
      <span class="stat"><b id="stPost">—</b> com post</span>
    </div>
    <div class="topbar-actions">
      <button class="btn filled" id="btnFetch" onclick="triggerFetch()">↺ Buscar</button>
      <button class="btn" id="btnBatch" onclick="triggerBatch()">Gerar posts</button>
      <button class="btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="filterbar">
    <span class="filter-label">Status</span>
    <button class="ftag on" data-f="status" data-v="">Todos</button>
    <button class="ftag" data-f="status" data-v="pending">Pendente</button>
    <button class="ftag" data-f="status" data-v="approved">Aprovado</button>
    <button class="ftag" data-f="status" data-v="rejected">Rejeitado</button>
    <div class="sep"></div>
    <span class="filter-label">Tipo</span>
    <button class="ftag on" data-f="type" data-v="">Todos</button>
    <button class="ftag" data-f="type" data-v="news">Notícias</button>
    <button class="ftag" data-f="type" data-v="video">Vídeos</button>
    <input class="search-input" id="searchInput" placeholder="Buscar..." oninput="renderItems()">
  </div>

  <div class="main">
    <div class="section-label" id="sectionLabel">— itens</div>
    <div class="grid" id="itemGrid">
      <div class="empty">Clique em <strong>↺ Buscar</strong> para carregar notícias e vídeos.</div>
    </div>

    <!-- X VÍDEOS -->
    <div class="xvideos-section">
      <div class="section-label" style="margin-top:0; margin-bottom:14px">Vídeos do X — adição manual</div>
      <div class="xvideos-add">
        <input id="xvUrl"  placeholder="URL do vídeo no X (ex: https://x.com/usuario/status/...)">
        <input id="xvNote" placeholder="Nota opcional" style="max-width:240px">
        <button class="btn filled" onclick="addXVideo()">Adicionar</button>
      </div>
      <div id="xvideoList">
        <div class="xvideo-empty">Nenhum vídeo adicionado ainda.</div>
      </div>
    </div>
  </div>

</div>

<script>
let TOKEN = '';
let items = [];
let filters = { status: '', type: '' };

// ── AUTH ──────────────────────────────────────────────────────────────────────
function doLogin() {
  TOKEN = document.getElementById('passInput').value;
  document.getElementById('loginErr').style.display = 'none';
  api('/api/stats').then(() => {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadItems();
    loadStats();
    loadXVideos();
  }).catch(() => {
    document.getElementById('loginErr').style.display = 'block';
    TOKEN = '';
  });
}
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
function logout() { TOKEN = ''; location.reload(); }

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-radar-token': TOKEN, ...(opts.headers || {}) }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
function loading(on) { document.getElementById('loaderBar').classList.toggle('on', on); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── DATA ──────────────────────────────────────────────────────────────────────
async function loadItems() {
  loading(true);
  try {
    const data = await api('/api/items');
    items = data.items || [];
    renderItems();
  } finally { loading(false); }
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    document.getElementById('stTotal').textContent    = s.total;
    document.getElementById('stPending').textContent  = s.pending;
    document.getElementById('stApproved').textContent = s.approved;
    document.getElementById('stPost').textContent     = s.withPost;
  } catch {}
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.ftag').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.f;
    document.querySelectorAll(`.ftag[data-f="${f}"]`).forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    filters[f] = btn.dataset.v;
    renderItems();
  });
});

// ── RENDER ITEMS ─────────────────────────────────────────────────────────────
function renderItems() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = items;
  if (filters.status) filtered = filtered.filter(i => i.status === filters.status);
  if (filters.type)   filtered = filtered.filter(i => i.type   === filters.type);
  if (q) filtered = filtered.filter(i =>
    i.title.toLowerCase().includes(q) || i.source.toLowerCase().includes(q)
  );

  const grid = document.getElementById('itemGrid');
  document.getElementById('sectionLabel').textContent = `${filtered.length} itens`;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">Nenhum item encontrado.</div>';
    return;
  }
  grid.innerHTML = '';
  filtered.forEach((item, idx) => grid.appendChild(buildCard(item, idx)));
}

function buildCard(item, idx) {
  const div = document.createElement('div');
  div.className = 'card';
  div.style.animationDelay = Math.min(idx * 20, 300) + 'ms';

  const statusBadge = item.status === 'approved'
    ? '<span class="badge badge-approved">Aprovado</span>'
    : item.status === 'rejected'
    ? '<span class="badge badge-rejected">Rejeitado</span>'
    : '';

  const typeBadge = item.type === 'video'
    ? '<span class="badge">Vídeo</span>'
    : '';

  const thumb = item.thumbnail
    ? `<img class="card-thumb" src="${item.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : '';

  const summary = item.summary
    ? `<div class="card-summary">${esc(item.summary.slice(0, 220))}${item.summary.length > 220 ? '…' : ''}</div>`
    : '';

  const postHTML = item.generatedPost ? buildPostHTML(item) : '';

  const dlLabel = item.downloadedFile ? '✓ Baixado' : '↓ Baixar';
  const dlClass = item.downloadedFile ? 'act act-done' : 'act';

  div.innerHTML = `
    <div class="card-header">
      <span class="card-source">${esc(item.source)}</span>
      <div class="card-badges">${statusBadge}${typeBadge}</div>
    </div>
    ${thumb}
    <div class="card-title">${esc(item.title)}</div>
    ${summary}
    <div class="card-meta">${formatDate(item.publishedAt)}</div>
    ${postHTML}
    <div class="card-actions">
      <button class="act" onclick="genPost('${item.id}', this)">${item.generatedPost ? 'Regerar' : 'Gerar post'}</button>
      ${item.type === 'video' ? `<button class="${dlClass}" onclick="dlVideo('${item.id}', this)">${dlLabel}</button>` : ''}
      ${item.url ? `<a class="act" href="${esc(item.url)}" target="_blank" rel="noopener">↗ Abrir</a>` : ''}
      <button class="act act-approve" onclick="setStatus('${item.id}','approved')">✓ Aprovar</button>
      <button class="act act-reject"  onclick="setStatus('${item.id}','rejected')">✕ Rejeitar</button>
    </div>
  `;

  // Conteúdo do post via textContent para preservar encoding
  if (item.generatedPost) {
    const pcEl = div.querySelector(`#pc_${item.id}`);
    if (pcEl) pcEl.textContent = getPostText(item.generatedPost);
  }

  return div;
}

function buildPostHTML(item) {
  const note = item.generatedPost.editorial_note || '';
  return `
    <div class="post-preview">
      <div class="post-label">Post X / Twitter</div>
      <div class="post-content" id="pc_${item.id}" contenteditable="true" onblur="saveEdit('${item.id}')"></div>
      ${note ? `<div class="post-note">${esc(note)}</div>` : ''}
    </div>`;
}

function getPostText(post) {
  // Suporta tanto o formato novo (post.text) quanto o legado (post.x.text)
  return post.text || post.x?.text || '';
}

function saveEdit(id) {
  const item = items.find(i => i.id === id);
  if (!item?.generatedPost) return;
  const val = document.getElementById('pc_' + id)?.textContent || '';
  item.generatedPost.text = val;
  api(`/api/items/${id}`, { method: 'PATCH', body: JSON.stringify({ generatedPost: item.generatedPost }) }).catch(() => {});
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
async function genPost(id, btn) {
  btn.disabled = true; btn.textContent = '…gerando';
  loading(true);
  try {
    const data = await api(`/api/generate/${id}`, { method: 'POST' });
    const item = items.find(i => i.id === id);
    if (item) item.generatedPost = data.post;
    renderItems();
    toast('Post gerado com sucesso');
  } catch (e) {
    toast('Erro: ' + e.message);
  } finally { loading(false); }
}

async function dlVideo(id, btn) {
  if (btn.classList.contains('act-done')) return;
  btn.disabled = true; btn.textContent = '…baixando';
  loading(true);
  try {
    await api(`/api/download/${id}`, { method: 'POST' });
    toast('Download iniciado — atualize em instantes');
    setTimeout(() => { loadItems(); loadStats(); }, 8000);
  } catch (e) {
    toast('Erro: ' + e.message);
    btn.disabled = false; btn.textContent = '↓ Baixar';
  } finally { loading(false); }
}

async function setStatus(id, status) {
  try {
    await api(`/api/items/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    const item = items.find(i => i.id === id);
    if (item) item.status = status;
    renderItems(); loadStats();
    toast(status === 'approved' ? '✓ Aprovado' : '✕ Rejeitado');
  } catch (e) { toast('Erro: ' + e.message); }
}

async function triggerFetch() {
  const btn = document.getElementById('btnFetch');
  btn.disabled = true; btn.textContent = '…buscando';
  loading(true);
  try {
    await api('/api/fetch', { method: 'POST' });
    toast('Busca iniciada — aguarde alguns segundos');
    setTimeout(() => { loadItems(); loadStats(); }, 6000);
  } catch (e) {
    toast('Erro: ' + e.message);
  } finally {
    loading(false);
    setTimeout(() => { btn.disabled = false; btn.textContent = '↺ Buscar'; }, 7000);
  }
}

async function triggerBatch() {
  const btn = document.getElementById('btnBatch');
  btn.disabled = true; btn.textContent = '…gerando';
  loading(true);
  try {
    const r = await api('/api/generate-batch', { method: 'POST' });
    toast(r.message);
    setTimeout(() => { loadItems(); loadStats(); }, 15000);
  } catch (e) {
    toast('Erro: ' + e.message);
  } finally {
    loading(false);
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Gerar posts'; }, 16000);
  }
}

// ── X VÍDEOS ─────────────────────────────────────────────────────────────────
async function loadXVideos() {
  try {
    const { videos } = await api('/api/xvideos');
    renderXVideos(videos);
  } catch {}
}

async function addXVideo() {
  const urlEl  = document.getElementById('xvUrl');
  const noteEl = document.getElementById('xvNote');
  const url    = urlEl.value.trim();
  if (!url) { toast('Cole a URL do vídeo'); return; }
  try {
    const { videos } = await api('/api/xvideos', {
      method: 'POST',
      body: JSON.stringify({ url, note: noteEl.value.trim() })
    });
    urlEl.value = ''; noteEl.value = '';
    renderXVideos(videos);
    toast('Vídeo adicionado');
  } catch (e) { toast('Erro: ' + e.message); }
}

async function removeXVideo(id) {
  try {
    await api(`/api/xvideos/${id}`, { method: 'DELETE' });
    loadXVideos();
    toast('Removido');
  } catch (e) { toast('Erro: ' + e.message); }
}

function renderXVideos(videos) {
  const list = document.getElementById('xvideoList');
  if (!videos || !videos.length) {
    list.innerHTML = '<div class="xvideo-empty">Nenhum vídeo adicionado ainda.</div>';
    return;
  }
  list.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'xvideo-list';
  videos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'xvideo-card';
    card.innerHTML = `
      <div class="xvideo-info">
        <div class="xvideo-url">${esc(v.url)}</div>
        ${v.note ? `<div class="xvideo-note">${esc(v.note)}</div>` : ''}
        <div class="xvideo-meta">${formatDate(v.addedAt)}</div>
      </div>
      <div class="xvideo-actions">
        <a class="act" href="${esc(v.url)}" target="_blank" rel="noopener">↗ Abrir</a>
        <button class="act act-reject" onclick="removeXVideo('${v.id}')">✕</button>
      </div>
    `;
    wrap.appendChild(card);
  });
  list.appendChild(wrap);
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', {
    timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

setInterval(loadStats, 30000);
</script>
