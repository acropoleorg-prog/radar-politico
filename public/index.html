<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Político · Acrópole</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:      #ffffff;
  --surface: #f5f5f5;
  --border:  #e0e0e0;
  --text:    #111111;
  --text-2:  #555555;
  --text-3:  #999999;
  --black:   #000000;
  --green:   #15803d;
  --red:     #b91c1c;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── LOGIN ── */
#loginScreen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.login-box { border: 1px solid var(--border); padding: 48px 40px; width: 360px; }
.login-eyebrow {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  letter-spacing: .18em; color: var(--text-3); text-transform: uppercase; margin-bottom: 16px;
}
.login-box h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 28px; }
.login-box input {
  width: 100%; padding: 10px 12px; margin-bottom: 12px;
  border: 1px solid var(--border); outline: none;
  font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text);
}
.login-box input:focus { border-color: var(--black); }
.btn-enter {
  width: 100%; padding: 10px; background: var(--black); color: #fff;
  border: none; font-size: 13px; font-weight: 500; cursor: pointer;
}
.btn-enter:hover { opacity: .85; }
.login-err { color: var(--red); font-size: 12px; margin-top: 10px; display: none; }

/* ── APP ── */
#app { display: none; }

/* ── TOPBAR ── */
.topbar {
  height: 52px; padding: 0 28px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 20px;
  position: sticky; top: 0; z-index: 10; background: var(--bg);
}
.brand { font-size: 15px; font-weight: 600; letter-spacing: -.02em; flex-shrink: 0; }
.brand span {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  font-weight: 400; color: var(--text-3); letter-spacing: .1em;
  text-transform: uppercase; margin-left: 10px;
}
.stats {
  display: flex; gap: 18px; margin-left: auto;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-3);
}
.stats b { color: var(--text); font-weight: 500; }
.topbar-btns { display: flex; gap: 6px; }
.btn {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 6px 14px; border: 1px solid var(--border);
  background: transparent; color: var(--text-2);
  cursor: pointer; text-transform: uppercase; letter-spacing: .06em;
  transition: border-color .12s, color .12s; white-space: nowrap;
}
.btn:hover { border-color: var(--black); color: var(--black); }
.btn.primary { background: var(--black); color: #fff; border-color: var(--black); }
.btn.primary:hover { opacity: .85; }
.btn:disabled { opacity: .35; cursor: not-allowed; }

/* ── FILTERBAR ── */
.filterbar {
  padding: 10px 28px; display: flex; gap: 6px; align-items: center;
  background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.flabel {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-3); text-transform: uppercase; letter-spacing: .12em; margin-right: 2px;
}
.ftag {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  padding: 4px 12px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text-3);
  cursor: pointer; text-transform: uppercase; letter-spacing: .05em;
  transition: all .12s;
}
.ftag:hover { border-color: var(--text-2); color: var(--text); }
.ftag.on { border-color: var(--black); background: var(--black); color: #fff; }
.search {
  margin-left: auto; padding: 5px 12px;
  border: 1px solid var(--border); outline: none;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  color: var(--text); width: 220px;
}
.search:focus { border-color: var(--black); }
.search::placeholder { color: var(--text-3); }

/* ── MAIN ── */
.main { padding: 24px 28px 80px; }
.count {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-3); text-transform: uppercase; letter-spacing: .15em; margin-bottom: 14px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 1px; background: var(--border); border: 1px solid var(--border);
}
.empty {
  grid-column: 1/-1; padding: 64px 24px;
  text-align: center; color: var(--text-3); font-size: 13px; background: var(--bg);
}

/* ── CARD ── */
.card {
  background: var(--bg); padding: 22px 24px;
  display: flex; flex-direction: column; gap: 10px;
  animation: fadeIn .2s ease both;
}
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }

.card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-source {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-3); text-transform: uppercase; letter-spacing: .1em;
}
.badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  padding: 2px 8px; border: 1px solid currentColor;
  text-transform: uppercase; letter-spacing: .05em;
}
.badge-approved { color: var(--green); }
.badge-rejected { color: var(--red); }

.card-title { font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; }
.card-summary { font-size: 13px; line-height: 1.65; color: var(--text-2); }

.card-footer {
  display: flex; align-items: center; gap: 8px;
  margin-top: 2px; flex-wrap: wrap;
}
.card-date {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  color: var(--text-3); margin-right: auto;
}
.act {
  font-family: 'IBM Plex Mono', monospace; font-size: 10px;
  padding: 5px 12px; border: 1px solid var(--border);
  background: transparent; color: var(--text-2);
  cursor: pointer; text-transform: uppercase; letter-spacing: .05em;
  text-decoration: none; display: inline-block; transition: all .12s;
}
.act:hover { border-color: var(--black); color: var(--black); }
.act-approve { border-color: var(--green); color: var(--green); }
.act-approve:hover { background: var(--green); color: #fff; }
.act-reject  { border-color: var(--red); color: var(--red); }
.act-reject:hover  { background: var(--red); color: #fff; }
.act-remove { color: var(--text-3); }
.act-remove:hover { border-color: var(--red); color: var(--red); }

/* ── LOADER / TOAST ── */
.loader {
  position: fixed; top: 0; left: 0; right: 0; height: 2px;
  background: var(--black); display: none; z-index: 999;
  animation: load 1s ease infinite;
}
.loader.on { display: block; }
@keyframes load {
  0%   { clip-path: inset(0 100% 0 0); }
  50%  { clip-path: inset(0 0 0 0); }
  100% { clip-path: inset(0 0 0 100%); }
}
#toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--black); color: #fff;
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  padding: 10px 18px; opacity: 0; transform: translateY(8px);
  transition: all .2s; pointer-events: none; z-index: 200; max-width: 300px;
}
#toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 640px) {
  .topbar { padding: 0 14px; flex-wrap: wrap; height: auto; padding: 10px 14px; }
  .stats { display: none; }
  .main { padding: 14px 12px 60px; }
  .grid { grid-template-columns: 1fr; }
  .filterbar { padding: 10px 12px; }
  .search { width: 100%; margin-left: 0; margin-top: 6px; }
}
</style>
</head>
<body>

<div class="loader" id="loader"></div>
<div id="toast"></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-eyebrow">Acrópole · Monitor</div>
    <h2>Radar Político</h2>
    <input type="password" id="passInput" placeholder="senha de acesso" autocomplete="current-password">
    <button class="btn-enter" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="loginErr">Senha incorreta.</div>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="topbar">
    <div class="brand">Radar Político <span>Acrópole</span></div>
    <div class="stats" id="statsEl">
      <span><b id="stTotal">—</b> total</span>
      <span><b id="stPending">—</b> pendentes</span>
      <span><b id="stApproved">—</b> aprovados</span>
    </div>
    <div class="topbar-btns">
      <button class="btn primary" id="btnFetch" onclick="triggerFetch()">↺ Atualizar</button>
      <button class="btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="filterbar">
    <span class="flabel">Status</span>
    <button class="ftag on" data-v="">Todos</button>
    <button class="ftag" data-v="pending">Pendente</button>
    <button class="ftag" data-v="approved">Aprovado</button>
    <button class="ftag" data-v="rejected">Rejeitado</button>
    <input class="search" id="searchInput" placeholder="Buscar título..." oninput="renderItems()">
  </div>

  <div class="main">
    <div class="count" id="countEl">—</div>
    <div class="grid" id="grid">
      <div class="empty">Clique em <strong>↺ Atualizar</strong> para carregar as notícias.</div>
    </div>
  </div>

</div>

<script>
let TOKEN   = '';
let items   = [];
let statusF = '';

// ── AUTH ──────────────────────────────────────────────────────────────────────
function doLogin() {
  TOKEN = document.getElementById('passInput').value;
  document.getElementById('loginErr').style.display = 'none';
  api('/api/stats')
    .then(() => {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadItems();
      loadStats();
    })
    .catch(() => {
      document.getElementById('loginErr').style.display = 'block';
      TOKEN = '';
    });
}
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
function logout() { TOKEN = ''; location.reload(); }

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-radar-token': TOKEN, ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
function loading(on) { document.getElementById('loader').classList.toggle('on', on); }
function toast(msg, dur = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

// ── DATA ──────────────────────────────────────────────────────────────────────
async function loadItems() {
  loading(true);
  try {
    const data = await api('/api/items');
    items = data.items || [];
    renderItems();
  } finally { loading(false); }
}

async function loadStats() {
  try {
    const s = await api('/api/stats');
    document.getElementById('stTotal').textContent   = s.total;
    document.getElementById('stPending').textContent = s.pending;
    document.getElementById('stApproved').textContent = s.approved;
  } catch {}
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.ftag').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ftag').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    statusF = btn.dataset.v;
    renderItems();
  });
});

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderItems() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = items;
  if (statusF) list = list.filter(i => i.status === statusF);
  if (q)       list = list.filter(i => i.title.toLowerCase().includes(q) || (i.source || '').toLowerCase().includes(q));

  const grid = document.getElementById('grid');
  document.getElementById('countEl').textContent = `${list.length} notícias`;

  if (!list.length) {
    grid.innerHTML = '<div class="empty">Nenhuma notícia encontrada.</div>';
    return;
  }

  grid.innerHTML = '';
  list.forEach((item, idx) => {
    const card = buildCard(item);
    card.style.animationDelay = Math.min(idx * 15, 250) + 'ms';
    grid.appendChild(card);
  });
}

function buildCard(item) {
  const div = document.createElement('div');
  div.className = 'card';

  const badge = item.status === 'approved'
    ? '<span class="badge badge-approved">Aprovado</span>'
    : item.status === 'rejected'
    ? '<span class="badge badge-rejected">Rejeitado</span>'
    : '';

  const summary = item.summary
    ? `<div class="card-summary">${esc(item.summary.slice(0, 240))}${item.summary.length > 240 ? '…' : ''}</div>`
    : '';

  div.innerHTML = `
    <div class="card-header">
      <span class="card-source">${esc(item.source)}</span>
      ${badge}
    </div>
    <div class="card-title">${esc(item.title)}</div>
    ${summary}
    <div class="card-footer">
      <span class="card-date">${formatDate(item.publishedAt)}</span>
      ${item.url ? `<a class="act" href="${esc(item.url)}" target="_blank" rel="noopener">↗ Abrir</a>` : ''}
      <button class="act act-approve" onclick="setStatus('${item.id}','approved')">✓</button>
      <button class="act act-reject"  onclick="setStatus('${item.id}','rejected')">✕</button>
      <button class="act act-remove"  onclick="removeItem('${item.id}')">rem</button>
    </div>
  `;
  return div;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
async function setStatus(id, status) {
  try {
    await api(`/api/items/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    const item = items.find(i => i.id === id);
    if (item) item.status = status;
    renderItems(); loadStats();
    toast(status === 'approved' ? '✓ Aprovado' : '✕ Rejeitado');
  } catch (e) { toast('Erro: ' + e.message); }
}

async function removeItem(id) {
  try {
    await api(`/api/items/${id}`, { method: 'DELETE' });
    items = items.filter(i => i.id !== id);
    renderItems(); loadStats();
    toast('Removido');
  } catch (e) { toast('Erro: ' + e.message); }
}

async function triggerFetch() {
  const btn = document.getElementById('btnFetch');
  btn.disabled = true; btn.textContent = '…buscando';
  loading(true);
  try {
    await api('/api/fetch', { method: 'POST' });
    toast('Buscando — aguarde alguns segundos');
    setTimeout(() => { loadItems(); loadStats(); }, 7000);
  } catch (e) {
    toast('Erro: ' + e.message);
  } finally {
    loading(false);
    setTimeout(() => { btn.disabled = false; btn.textContent = '↺ Atualizar'; }, 8000);
  }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    day: '2-digit', month: '2-digit',
    hour: '2-digit', minute: '2-digit',
  });
}

setInterval(loadStats, 60000);
</script>
</body>
</html>
